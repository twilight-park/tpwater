#!/bin/bash
# deploy.conf — tpwater hub proxy at tpwater.rkroll.com
#
# The tpwater hub (tpwater-hub.tcl) is already running on data.rkroll.com
# managed by tpwater.sh / crontab. This only sets up SSL + Apache proxy.
#
# Usage:
#   deploy.sh init .   # first deploy: SSL cert + Apache vhost

export DEPLOY_TYPES="letsencrypt apache"

export APP_NAME="tpwater"
export DOMAIN_NAME="tpwater.rkroll.com"
export REMOTE_HOST="data.rkroll.com"
export REMOTE_USER="john"

# --- Let's Encrypt ----------------------------------------------------------
export LETSENCRYPT_EMAIL="john@rkroll.com"

# --- Apache -----------------------------------------------------------------
export APACHE_MODE="proxy"
export APACHE_PROXY_RULES="/:7777:/"
export APACHE_SPA_MODE="no"
